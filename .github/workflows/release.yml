# release.yml — build & stamp asdf-tui with a real version, nothing more.
#
# The rule the whole file is built around: **without a command nothing is
# pushed.** There is no `push` trigger on tags, no `schedule`, no auto-commit
# back to the repo. The three paths are exactly the three arguments of
# .github/scripts/next-version.sh (single source of truth — reproduce locally first):
#
#   pull_request        ->  build 1.2.3-alpha.<PR#>      artifact only
#   workflow_dispatch   ->  build 1.2.3-{alpha|beta|rc}.<run#>   artifact only
#   push on main        ->  build 1.2.4 + git tag + GitHub Release   (the merge)
#
# A push to main is a patch bump. Put [minor] or [major] in the merge commit
# message (GitHub copies the PR title into the merge message body, so a marker
# in the title is enough) to bump further; next-version.sh reads it there.
#
# The pull_request and push triggers are `paths`-filtered: the binary only
# depends on the Go sources, so a docs/catalog/CI-only change is never
# rebuilt nor released (docs/CI-only merges do not bump the version).
# workflow_dispatch stays unconditional — it is an explicit "build now".
#
# Every job that touches the version runs the same
#   .github/scripts/next-version.sh for-...
# the developer can run on their machine before pushing, so a reviewer can
# check that CI stamp == the version the author previews locally.

name: release

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      prerelease:
        description: prerelease flavor for the manual artifact build
        type: choice
        default: rc
        options: [alpha, beta, rc]
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # the script below decides every released version, so its rules are
      # tested before anything depends on them
      - name: Test the version rules
        run: .github/scripts/next-version_test.sh

      - name: Resolve version from git
        id: resolve
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              V="$(.github/scripts/next-version.sh for-pr "${{ github.event.pull_request.number }}")" ;;
            workflow_dispatch)
              V="$(.github/scripts/next-version.sh for-dispatch "${{ github.event.inputs.prerelease }}")" ;;
            push)
              # The bump kind comes from the merge commit: a plain merge is a
              # patch, a message containing [minor] or [major] bumps that far.
              # Add the marker to the PR title or the merge message box and
              # the release becomes 0.2.0 / 1.0.0 with no edit here.
              V="$(.github/scripts/next-version.sh for-merge)" ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved ${{ github.event_name }} -> $V"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # darwin/386 does not exist, everything else is a plain CGO_ENABLED=0
        # cross build. 386 is kept for the 32-bit Linux boxes asdf still runs on.
        goos: [linux, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goos: darwin
            goarch: "386"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and stamp version
        id: build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          out="dist/asdf-tui-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "$out" .
          echo "name=$(basename "$out")" >> "$GITHUB_OUTPUT"

      # Only the runner's own target can be executed here (linux/amd64); every
      # other binary — including linux/386 on a 64-bit runner — is checked by
      # looking for the stamped string in it.
      - name: Verify the stamped version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          out="dist/asdf-tui-${VERSION}-linux-amd64"
          got="$(./$out version)"
          want="asdf-tui ${VERSION}"
          [[ "$got" == "$want" ]] || {
            echo "stamp mismatch: got '$got', want '$want'" >&2; exit 1
          }
          echo "verified: $got"

      - name: Verify the stamp without running the binary
        if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          out="dist/asdf-tui-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          # no -q: grep must drain the pipe, otherwise `strings` dies on SIGPIPE
          # and pipefail turns a *passing* check into a failure
          strings "$out" | grep -Fx "${VERSION}" >/dev/null \
            || { echo "stamp missing: $out" >&2; exit 1; }
          echo "verified ${{ matrix.goos }}/${{ matrix.goarch }}: ${VERSION}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/asdf-tui-*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version is not already tagged (idempotent re-run)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists; nothing to publish."
            echo "already=1" >> "$GITHUB_ENV"
          fi

      - name: Build tagged artifacts
        if: env.already != '1'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # same matrix as the build job: everything but darwin/386
          for target in linux/386 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="dist/asdf-tui-${VERSION}-${goos}-${goarch}"
            CGO_ENABLED=0 GOOS=${goos} GOARCH=${goarch} go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
            if [[ "${target}" == "linux/amd64" ]]; then
              [[ "$(./$out version)" == "asdf-tui ${VERSION}" ]] \
                || { echo "stamp mismatch: $out" >&2; exit 1; }
            else
              # no -q: grep must drain the pipe, otherwise `strings` dies on
              # SIGPIPE and pipefail turns a *passing* check into a failure
              strings "$out" | grep -Fx "${VERSION}" >/dev/null \
                || { echo "stamp missing: $out" >&2; exit 1; }
            fi
          done

      - name: Create git tag and GitHub Release
        if: env.already != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: dist/asdf-tui-*
          body: |
            ## What's new
            - Cross-compiled `asdf-tui` binaries with the version baked in —
              `asdf-tui version` now prints exactly `${{ needs.version.outputs.version }}`.

            ## Binaries
            | platform | file |
            | --- | --- |
            | linux/386 | `asdf-tui-${{ needs.version.outputs.version }}-linux-386` |
            | linux/amd64 | `asdf-tui-${{ needs.version.outputs.version }}-linux-amd64` |
            | linux/arm64 | `asdf-tui-${{ needs.version.outputs.version }}-linux-arm64` |
            | darwin/amd64 | `asdf-tui-${{ needs.version.outputs.version }}-darwin-amd64` |
            | darwin/arm64 | `asdf-tui-${{ needs.version.outputs.version }}-darwin-arm64` |

            macOS: `chmod +x` the binary and drop it anywhere on your `PATH`.
          generate_release_notes: true
